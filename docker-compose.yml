services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: public_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      # Opcional: sobrescreva via .env (veja .env.example)
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/public_data}
      NEWS_DELETE_API_KEY: ${NEWS_DELETE_API_KEY:-}
    ports:
      - "8001:8000"
    depends_on:
      - db

volumes:
  postgres_data:
